<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayview Compute</title>
<meta name="description" content="Bayview Compute — compute infrastructure for AI teams. San Francisco, California.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2327251F'/%3E%3Cg fill='none' stroke='%23FD5A1E' stroke-width='4' stroke-linecap='square'%3E%3Cpath d='M8 18h50M14 18l8 36M30 18l-8 36M40 18v8M40 26v14'/%3E%3C/g%3E%3Crect x='34' y='40' width='12' height='5' fill='%23FD5A1E'/%3E%3C/svg%3E">
<style>
  :root {
    --orange: #FD5A1E;
    --black: #27251F;
    --beige: #EFD19F;
    --cream: #FAF4E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--black);
    color: var(--cream);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header, main, footer { width: 100%; max-width: 960px; margin: 0 auto; padding: 0 32px; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding-top: 32px;
    font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 14px;
  }
  header svg { width: 36px; height: 36px; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    align-items: center;
    gap: 48px;
    padding-top: 64px; padding-bottom: 64px;
  }
  .eyebrow {
    color: var(--orange);
    font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    margin-bottom: 20px;
  }
  h1 {
    font-size: clamp(40px, 6vw, 68px);
    line-height: 1.02;
    letter-spacing: -0.02em;
    font-weight: 800;
    margin-bottom: 24px;
  }
  h1 span { color: var(--orange); }
  p.lede {
    font-size: 19px; line-height: 1.55;
    color: var(--beige);
    max-width: 30em;
    margin-bottom: 36px;
  }
  a.cta {
    display: inline-block;
    background: var(--orange); color: var(--black);
    text-decoration: none; font-weight: 700;
    padding: 14px 24px; border-radius: 4px;
    transition: transform .15s ease, background .15s ease;
  }
  a.cta:hover { background: var(--beige); transform: translateY(-1px); }
  .mark { width: 100%; max-width: 380px; justify-self: end; }
  footer {
    border-top: 1px solid rgba(239, 209, 159, 0.18);
    padding-top: 24px; padding-bottom: 32px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    font-size: 14px; color: rgba(239, 209, 159, 0.75);
  }
  footer a { color: inherit; }
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; padding-top: 40px; gap: 32px; }
    .mark { justify-self: start; max-width: 260px; order: -1; }
  }
</style>
</head>
<body>

<header>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <g fill="none" stroke="#FD5A1E" stroke-width="4" stroke-linecap="square">
      <path d="M6 16h54M14 16l8 40M30 16l-8 40M42 16v10M42 26v14"/>
    </g>
    <rect x="36" y="40" width="12" height="5" fill="#FD5A1E"/>
  </svg>
  Bayview Compute
</header>

<main>
  <section>
    <div class="eyebrow">San Francisco, California</div>
    <h1>Compute infrastructure<br>for <span>AI teams.</span></h1>
    <p class="lede">Bayview Compute helps AI companies find, secure and scale the compute capacity they need to train and run models.</p>
    <a class="cta" href="mailto:hello@bayviewcompute.com">hello@bayviewcompute.com</a>
  </section>

  <svg class="mark" viewBox="0 0 400 360" role="img" aria-label="Gantry crane mark">
    <!-- girder -->
    <rect x="20" y="60" width="360" height="22" fill="#FD5A1E"/>
    <g stroke="#27251F" stroke-width="3">
      <path d="M40 60l20 22M60 60l20 22M80 60l20 22M100 60l20 22M120 60l20 22M140 60l20 22M160 60l20 22M180 60l20 22M200 60l20 22M220 60l20 22M240 60l20 22M260 60l20 22M280 60l20 22M300 60l20 22M320 60l20 22M340 60l20 22"/>
    </g>
    <!-- machinery house -->
    <rect x="70" y="30" width="80" height="30" fill="#EFD19F"/>
    <!-- legs -->
    <g fill="none" stroke="#FD5A1E" stroke-width="14" stroke-linecap="square">
      <path d="M80 82L110 330M180 82L150 330"/>
      <path d="M95 210h70"/>
    </g>
    <!-- trolley, cable, block -->
    <rect x="262" y="82" width="44" height="16" fill="#EFD19F"/>
    <path d="M276 98v130M292 98v130" stroke="#EFD19F" stroke-width="3"/>
    <rect x="266" y="228" width="36" height="18" fill="#FD5A1E"/>
    <path d="M284 246v14a10 10 0 1 1-10 10" fill="none" stroke="#FD5A1E" stroke-width="6"/>
    <!-- ground -->
    <rect x="20" y="330" width="360" height="6" fill="#EFD19F" opacity="0.35"/>
  </svg>
</main>

<footer>
  <div>&copy; 2026 Bayview Compute &middot; San Francisco, CA</div>
  <div><a href="mailto:hello@bayviewcompute.com">hello@bayviewcompute.com</a></div>
</footer>

</body>
</html>
